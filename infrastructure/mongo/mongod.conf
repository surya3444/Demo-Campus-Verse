# MongoDB configuration for production

storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5  # Adjust based on droplet RAM (use ~25% of available RAM)

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true

net:
  port: 27017
  bindIp: 0.0.0.0

replication:
  replSetName: rs0

# Security - enable after initial setup
# security:
#   authorization: enabled
